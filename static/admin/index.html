<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker MANIA 管理画面</title>
</head>
<body>
  <!-- 管理画面本体（Decap CMS） -->
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    // ① 画像（サイズ選択）
    CMS.registerEditorComponent({
      id: "sizedimage",
      label: "画像（サイズ選択）",
      fields: [
        { name: "src", label: "画像", widget: "image" },
        { name: "alt", label: "説明（任意）", widget: "string", required: false },
        {
          name: "size", label: "サイズ", widget: "select", default: "480",
          options: [
            { label: "小（300px）", value: "300" },
            { label: "中（480px）", value: "480" },
            { label: "大（680px）", value: "680" },
            { label: "全幅", value: "full" }
          ]
        }
      ],
      pattern: /^<img src="(.*?)" alt="(.*?)" class="pimg pimg-(.*?)">$/,
      fromBlock: function (m) { return { src: m[1], alt: m[2], size: m[3] }; },
      toBlock: function (o) { return '<img src="' + (o.src || '') + '" alt="' + (o.alt || '') + '" class="pimg pimg-' + (o.size || '480') + '">'; },
      toPreview: function (o) {
        var w = o.size === 'full' ? '100%' : (o.size || '480') + 'px';
        return '<img src="' + (o.src || '') + '" alt="' + (o.alt || '') + '" style="max-width:' + w + ';width:100%;height:auto;border-radius:10px;display:block;margin:10px auto;">';
      }
    });

    // ② 囲みボックス（緑）
    CMS.registerEditorComponent({
      id: "greenbox",
      label: "囲みボックス（緑）",
      fields: [ { name: "text", label: "内容（改行で複数行OK）", widget: "text" } ],
      pattern: /^<div class="pbox">([\s\S]*?)<\/div>$/,
      fromBlock: function (m) { return { text: (m[1] || '').replace(/<br\s*\/?>/g, "\n") }; },
      toBlock: function (o) { return '<div class="pbox">' + (o.text || '').replace(/\r?\n/g, "<br>") + '</div>'; },
      toPreview: function (o) {
        return '<div style="background:#f1f7f3;border:1px solid #dcebe2;border-left:3px solid #2f8a5b;border-radius:8px;padding:10px 14px;font-size:13.5px;color:#55524b;line-height:1.85;">' + (o.text || '').replace(/\r?\n/g, "<br>") + '</div>';
      }
    });

    // ③ テキスト（サイズ・色）— WordPress風に px と色を指定
    CMS.registerEditorComponent({
      id: "styledtext",
      label: "テキスト（サイズ・色）",
      fields: [
        { name: "text", label: "文章", widget: "string" },
        { name: "size", label: "文字サイズ（px：10〜60）", widget: "number", default: 16, value_type: "int", min: 10, max: 60, step: 1 },
        { name: "color", label: "文字色", widget: "color", default: "#3c3c44", allowInput: true },
        { name: "bold", label: "太字にする", widget: "boolean", default: false, required: false }
      ],
      pattern: /^<p class="ptxt" style="font-size:(\d+)px;color:([^;"]*);font-weight:(\d+)">([\s\S]*?)<\/p>$/,
      fromBlock: function (m) {
        return { size: parseInt(m[1], 10), color: m[2], bold: m[3] === "700", text: m[4] };
      },
      toBlock: function (o) {
        var weight = o.bold ? "700" : "400";
        return '<p class="ptxt" style="font-size:' + (o.size || 16) + 'px;color:' + (o.color || '#3c3c44') + ';font-weight:' + weight + '">' + (o.text || '') + '</p>';
      },
      toPreview: function (o) {
        var weight = o.bold ? "700" : "400";
        return '<p style="font-size:' + (o.size || 16) + 'px;color:' + (o.color || '#3c3c44') + ';font-weight:' + weight + ';line-height:1.5;">' + (o.text || '') + '</p>';
      }
    });
  </script>
</body>
</html>
