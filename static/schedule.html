html,body{background:#1c1c2e;font-family:-apple-system,sans-serif;color:#e8e0d0;min-height:100vh;}

.header{position:sticky;top:0;z-index:50;background:#1c1c2e;border-bottom:1px solid rgba(201,168,76,0.2);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}

.header-title{font-size:16px;font-weight:700;color:#c9a84c;}
.back-link{background:rgba(255,255,255,0.08);border-radius:8px;color:rgba(255,255,255,0.6);font-size:12px;padding:6px 10px;cursor:pointer;text-decoration:none;}

/* フィルター */
.filter-wrap{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(255,255,255,0.06);}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filter-label{font-size:10px;color:rgba(201,168,76,0.6);letter-spacing:0.1em;min-width:36px;}
.filter-btn{padding:5px 10px;border-radius:14px;font-size:11px;font-weight:600;border:1.5px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.5);cursor:pointer;}
.filter-btn.active{border-color:#c9a84c;color:#c9a84c;background:rgba(201,168,76,0.12);}

/* 検索 */
.search-wrap{padding:0 14px 10px;}
.search-input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#e8e0d0;font-size:13px;padding:9px 12px;font-family:-apple-system,sans-serif;}
.search-input:focus{outline:none;border-color:rgba(201,168,76,0.5);}

/* 年切替タブ */
.year-tabs{display:flex;gap:6px;padding:10px 14px 0;}
.year-tab{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;border:none;cursor:pointer;background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.4);}
.year-tab.active{background:#c9a84c;color:#1c1c2e;}

/* リスト */
.list-wrap{padding:10px 14px 60px;}
.month-group{margin-bottom:4px;}
.month-header{font-size:11px;font-weight:700;color:rgba(201,168,76,0.7);letter-spacing:0.12em;padding:14px 2px 6px;display:flex;align-items:center;gap:8px;}
.month-header::after{content:'';flex:1;height:1px;background:rgba(201,168,76,0.15);}

.event-card{background:#2a2a42;border-radius:12px;padding:13px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:border-color 0.15s;}
.event-card:active{border-color:rgba(201,168,76,0.4);}
.event-card.interested{border-color:rgba(201,168,76,0.5);background:rgba(201,168,76,0.06);}
.event-card.going{border-color:rgba(74,158,255,0.5);background:rgba(74,158,255,0.06);}
.event-card.past{opacity:0.45;}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.card-tour{font-size:10px;font-weight:700;letter-spacing:0.08em;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.card-status-btn{font-size:18px;cursor:pointer;background:none;border:none;padding:2px;line-height:1;}

.card-name{font-size:14px;font-weight:700;color:#e8e0d0;line-height:1.3;flex:1;}

.card-meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:11px;color:rgba(255,255,255,0.45);}
.card-meta-item{display:flex;align-items:center;gap:4px;}
.card-meta-icon{font-size:12px;}
.card-dates{font-size:12px;font-weight:600;color:#c9a84c;}

/* ステータス凡例 */
.legend{display:flex;gap:12px;padding:8px 14px;font-size:10px;color:rgba(255,255,255,0.35);flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:4px;}

/* ツアーカラー */
.tour-APT{background:rgba(201,168,76,0.18);color:#c9a84c;}
.tour-APPT{background:rgba(255,50,100,0.18);color:#ff6090;}
.tour-WPT{background:rgba(50,150,255,0.18);color:#4a9eff;}
.tour-Triton{background:rgba(200,50,255,0.18);color:#cc66ff;}
.tour-USOP{background:rgba(50,220,180,0.18);color:#32ddb4;}
.tour-GOP{background:rgba(255,165,50,0.18);color:#ffa532;}
.tour-RDPT{background:rgba(255,80,80,0.18);color:#ff5050;}
.tour-TMT{background:rgba(100,220,100,0.18);color:#64dc64;}
.tour-KPC{background:rgba(220,180,50,0.18);color:#dcb432;}
.tour-Other{background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);}

.empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.25);font-size:14px;}
.empty-icon{font-size:48px;margin-bottom:12px;}

/* 件数バッジ */
.count-badge{background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:12px;font-size:11px;color:#c9a84c;padding:2px 8px;margin-left:auto;}

/* 国旗エモジ */
.flag{font-size:14px;}

/* 詳細モーダル */
.modal{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end;justify-content:center;}
.modal.show{display:flex;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.65);}
.modal-sheet{position:relative;width:100%;max-width:520px;background:#252540;border-radius:20px 20px 0 0;border-top:1px solid rgba(201,168,76,0.4);padding:20px 16px 44px;}
.modal-title{font-size:15px;font-weight:700;color:#c9a84c;margin-bottom:4px;}
.modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.1);border:none;border-radius:50%;width:28px;height:28px;color:#e8e0d0;font-size:14px;cursor:pointer;}
.modal-info-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;}
.modal-info-label{color:rgba(255,255,255,0.35);min-width:60px;font-size:11px;padding-top:2px;}
.modal-info-val{color:#e8e0d0;font-weight:500;flex:1;}
.status-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
.status-option{padding:12px 8px;border-radius:10px;border:2px solid transparent;font-size:13px;font-weight:700;cursor:pointer;text-align:center;background:rgba(255,255,255,0.06);}
.status-option.none-opt{color:rgba(255,255,255,0.4);border-color:rgba(255,255,255,0.15);}
.status-option.none-opt.sel{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.4);}
.status-option.interested-opt{color:#c9a84c;border-color:rgba(201,168,76,0.3);}
.status-option.interested-opt.sel{background:rgba(201,168,76,0.15);border-color:#c9a84c;}

// ===== 状態 =====
let currentYear = 2026;
let userStatuses = JSON.parse(localStorage.getItem('poker-schedule-status') || '{}');
let filters = { country: 'ALL', tour: 'ALL', status: 'ALL' };
let selectedEvent = null;

function saveStatuses() {
  localStorage.setItem('poker-schedule-status', JSON.stringify(userStatuses));
}

// ===== フィルター =====
function toggleFilter(type, val) {
  filters[type] = val;
  document.querySelectorAll(`[data-filter="${type}"]`).forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-filter="${type}"][data-val="${val}"]`).classList.add('active');
  renderList();
}

function setYear(y) {
  currentYear = y;
  document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${y}`).classList.add('active');
  renderList();
}

function isPast(end) {
  return new Date(end) < new Date(new Date().toISOString().split('T')[0]);
}

function isAsian(country) {
  return ASIA_COUNTRIES.includes(country);
}

function getTourKey(tour) {
  if (['APT'].includes(tour)) return 'APT';
  if (['APPT'].includes(tour)) return 'APPT';
  if (['WPT'].includes(tour)) return 'WPT';
  if (['Triton'].includes(tour)) return 'Triton';
  if (['GOP'].includes(tour)) return 'GOP';
  if (['USOP'].includes(tour)) return 'USOP';
  if (['RDPT'].includes(tour)) return 'RDPT';
  if (['TMT'].includes(tour)) return 'TMT';
  if (['KPC'].includes(tour)) return 'KPC';
  return 'Other';
}

function getCountryGroup(country) {
  if (['KOR'].includes(country)) return 'KOR';
  if (['TWN'].includes(country)) return 'TWN';
  if (['PHL'].includes(country)) return 'PHL';
  if (['VNM'].includes(country)) return 'VNM';
  if (['JPN'].includes(country)) return 'JPN';
  if (ASIA_COUNTRIES.includes(country)) return 'OTHER';
  return 'OTHER';
}

// ===== レンダリング =====
function renderList() {
  const wrap = document.getElementById('list-wrap');
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const events = EVENTS[currentYear] || [];
  const today = new Date().toISOString().split('T')[0];

  let filtered = events.filter(e => {
    // 国フィルター
    if (filters.country !== 'ALL') {
      if (getCountryGroup(e.country) !== filters.country) return false;
    }
    // ツアーフィルター
    if (filters.tour !== 'ALL') {
      if (getTourKey(e.tour) !== filters.tour) return false;
    }
    // 状態フィルター
    const st = userStatuses[e.id] || 'none';
    if (filters.status === 'upcoming') {
      if (e.end < today) return false;
    } else if (filters.status === 'interested') {
      if (st !== 'interested') return false;
    } else if (filters.status === 'going') {
      if (st !== 'going') return false;
    }
    // 検索
    if (q) {
      const text = (e.name + e.city + e.country + e.tour).toLowerCase();
      if (!text.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('count-badge').textContent = `${filtered.length} 件`;

  if (!filtered.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div>該当するイベントがありません</div>`;
    return;
  }

  // 月ごとにグループ
  const byMonth = {};
  filtered.forEach(e => {
    const m = e.start.slice(0, 7);
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(e);
  });

  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  wrap.innerHTML = Object.keys(byMonth).sort().map(m => {
    const [y, mo] = m.split('-');
    const label = `${y}年 ${monthNames[parseInt(mo)-1]}`;
    const cards = byMonth[m].map(e => renderCard(e, today)).join('');
    return `<div class="month-group"><div class="month-header">${label}</div>${cards}</div>`;
  }).join('');
}

function renderCard(e, today) {
  const st = userStatuses[e.id] || 'none';
  const past = e.end < today;
  const tourKey = getTourKey(e.tour);
  const flag = COUNTRY_FLAGS[e.country] || '🌏';

  const statusIcon = st === 'interested' ? '⭐' : st === 'going' ? '✈️' : '◯';
  const cardClass = `event-card${st === 'interested' ? ' interested' : st === 'going' ? ' going' : ''}${past ? ' past' : ''}`;

  const startD = e.start.slice(5).replace('-', '/');
  const endD = e.end.slice(5).replace('-', '/');

  return `<div class="${cardClass}" onclick="openDetail('${e.id}')">
    <div class="card-top">
      <span class="card-tour tour-${tourKey}">${e.tour}</span>
      <span class="card-name">${e.name}</span>
      <button class="card-status-btn" onclick="event.stopPropagation();cycleStatus('${e.id}')">${statusIcon}</button>
    </div>
    <div class="card-meta">
      <span class="card-meta-item"><span class="flag">${flag}</span>${COUNTRY_NAMES[e.country]||e.country} · ${e.city}</span>
      <span class="card-dates">${startD} 〜 ${endD}</span>
      ${e.gtd && e.gtd !== 'TBA' ? `<span class="card-meta-item">💰 ${e.gtd}</span>` : ''}
    </div>
  </div>`;
}

function cycleStatus(id) {
  const cur = userStatuses[id] || 'none';
  const next = cur === 'none' ? 'interested' : cur === 'interested' ? 'going' : 'none';
  userStatuses[id] = next;
  saveStatuses();
  renderList();
}

function openDetail(id) {
  const e = (EVENTS[2026] || []).concat(EVENTS[2025] || []).find(ev => ev.id === id);
  if (!e) return;
  selectedEvent = e;

  const st = userStatuses[e.id] || 'none';
  const flag = COUNTRY_FLAGS[e.country] || '🌏';
  const tourKey = getTourKey(e.tour);
  const startD = e.start.replace(/-/g, '/');
  const endD = e.end.replace(/-/g, '/');

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">${e.name}</div>
    <div style="margin-bottom:12px;"><span class="card-tour tour-${tourKey}">${e.tour}</span></div>
    <div class="modal-info-row"><span class="modal-info-label">日程</span><span class="modal-info-val card-dates">${startD} 〜 ${endD}</span></div>
    <div class="modal-info-row"><span class="modal-info-label">場所</span><span class="modal-info-val">${flag} ${COUNTRY_NAMES[e.country]||e.country} · ${e.city}</span></div>
    ${e.gtd && e.gtd !== 'TBA' ? `<div class="modal-info-row"><span class="modal-info-label">GTD</span><span class="modal-info-val">💰 ${e.gtd}</span></div>` : ''}
    <div style="margin-top:14px;font-size:11px;color:rgba(201,168,76,0.7);letter-spacing:0.08em;margin-bottom:8px;">ステータス</div>
    <div class="status-grid">
      <div class="status-option none-opt${st==='none'?' sel':''}" onclick="setStatus('${e.id}','none')">◯<br><span style="font-size:10px;">なし</span></div>
      <div class="status-option interested-opt${st==='interested'?' sel':''}" onclick="setStatus('${e.id}','interested')">⭐<br><span style="font-size:10px;">気になる</span></div>
      <div class="status-option going-opt${st==='going'?' sel':''}" onclick="setStatus('${e.id}','going')">✈️<br><span style="font-size:10px;">参加予定</span></div>
    </div>
    ${e.url ? `<a class="modal-link" href="${e.url}" target="_blank">🔗 詳細・公式サイトを見る</a>` : ''}
  `;
  document.getElementById('detail-modal').classList.add('show');
}

function setStatus(id, st) {
  userStatuses[id] = st;
  saveStatuses();
  renderList();
  // モーダル内のボタン更新
  document.querySelectorAll('.status-option').forEach(el => el.classList.remove('sel'));
  const map = {none:'.none-opt', interested:'.interested-opt', going:'.going-opt'};
  const el = document.querySelector(map[st]);
  if (el) el.classList.add('sel');
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('show');
  selectedEvent = null;
}

// 初期レンダリング
renderList();
</script>
